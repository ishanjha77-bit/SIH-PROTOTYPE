services:
  # website + API in one container (the same image you deploy): http://localhost:8000
  app:
    build: .
    ports: ["8000:8000"]

  # --- streaming tier: docker compose --profile streaming up ---
  redpanda:
    profiles: ["streaming"]
    image: redpandadata/redpanda:latest
    command: redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
    healthcheck: { test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"], interval: 5s, timeout: 10s, retries: 20 }
  timescaledb:
    profiles: ["streaming"]
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_USER: weatherguard, POSTGRES_PASSWORD: weatherguard, POSTGRES_DB: weatherguard }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U weatherguard -d weatherguard"], interval: 3s, timeout: 5s, retries: 20 }
  qc-worker:
    profiles: ["streaming"]
    build:
      context: .
      args: { EXTRA_PIP: "aiokafka>=0.10 psycopg[binary]>=3.1" }   # streaming clients, not in the slim web image
    image: weatherguard-streaming
    command: python -m app.streaming.worker --role worker
    environment: { BUS: kafka, KAFKA_BOOTSTRAP: "redpanda:9092", STORE: timescale, DATABASE_URL: "postgresql://weatherguard:weatherguard@timescaledb:5432/weatherguard" }
    depends_on:   # wait until Kafka and the database accept connections, instead of crash-looping
      redpanda: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    restart: on-failure
  station-producer:
    profiles: ["streaming"]
    image: weatherguard-streaming   # same image as qc-worker
    pull_policy: never
    command: python -m app.streaming.worker --role producer --speed 1
    environment: { BUS: kafka, KAFKA_BOOTSTRAP: "redpanda:9092" }
    depends_on:
      redpanda: { condition: service_healthy }
      qc-worker: { condition: service_started }
    restart: on-failure
